<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ichipapa のアプリ</title>
<meta name="description" content="Ichipapa が開発している iPhone アプリの一覧です。">
<style>
  :root { --text: #222; --sub: #666; --line: #e6e6e6; --card: #fff; --bg: #f7f7f9; --link: #1a73e8; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #eee; --sub: #aaa; --line: #333; --card: #1c1c1f; --bg: #111113; --link: #6ea8ff; }
  }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.7; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 28px; }
  .app { display: flex; gap: 16px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
  .app img { width: 84px; height: 84px; border-radius: 19px; flex-shrink: 0; }
  .app h2 { font-size: 20px; margin: 0; }
  .app p { margin: 4px 0 10px; color: var(--sub); }
  .links { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { color: var(--sub); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Ichipapa のアプリ</h1>
  <p class="lead">個人で開発している iPhone アプリの一覧です。</p>

  <section class="app">
    <img src="images/gravitypuzzle.png" alt="グラビティパズルのアイコン">
    <div>
      <h2>グラビティパズル</h2>
      <p>上下左右に重力を切り替えて、ボールをゴールへ導くパズルゲーム。</p>
      <div class="links">
        <a href="https://apps.apple.com/jp/app/id6824658083">App Store</a>
        <a href="https://ichipapa.github.io/gravitypuzzle-privacy/">プライバシーポリシー</a>
        <a href="https://ichipapa.github.io/gravitypuzzle-privacy/support.html">サポート</a>
      </div>
    </div>
  </section>

  <footer>
    お問い合わせ：ichipapa.apps@gmail.com<br>
    © 2026 Ichipapa
  </footer>
</main>
</body>
</html>
